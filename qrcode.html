<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QR Code Generator — Epsilon</title><link rel="stylesheet" href="qr.css"><link rel="stylesheet" href="qr-overrides.css"></head><body><main class="qr-app"><header class="qr-header"><a class="qr-brand" href="index.html"><span class="qr-brand-mark">E</span><span>Epsilon · QR Code Generator</span></a><a class="back-home" href="index.html">All tools</a></header><div class="qr-layout"><section class="qr-main"><h1>URL to QR Code</h1><p class="lead">Convert a link or any text into a QR code you can download and share.</p><div class="type-tabs"><button class="type-tab active" data-type="URL">URL</button><button class="type-tab" data-type="vCard">vCard</button><button class="type-tab" data-type="Mail">Mail</button><button class="type-tab" data-type="Wi-Fi">Wi-Fi</button></div><div id="tab-notice" class="tab-notice" role="status" aria-live="polite"></div><div class="input-card"><div id="input-area"></div><button id="generate" class="generate">Generate QR Code</button></div><div class="options-card"><div class="field"><label for="error-level">Error correction</label><select id="error-level"><option value="M">Medium</option><option value="L">Low</option><option value="Q">High</option><option value="H">Highest</option></select></div><div class="field"><label for="export-size">Export size</label><select id="export-size"><option value="1000">1000 × 1000 pixels</option><option value="800">800 × 800 pixels</option><option value="500">500 × 500 pixels</option></select></div><div class="field"><label for="module-shape">Module shape</label><select id="module-shape"><option value="square">Square</option><option value="rounded">Rounded</option><option value="dots">Dots</option><option value="diamond">Diamond</option></select></div><div class="field"><label for="module-color">Module color</label><input id="module-color" type="color" value="#000000"></div></div></section><aside class="preview-card"><p class="preview-title">Preview</p><div id="qr-output" class="qr-output"><p class="qr-empty">Your QR code will appear here</p></div><div class="download-row"><button id="download-png" class="download-primary" disabled>PNG</button><button id="download-svg" disabled>SVG</button><button id="download-pdf" disabled>PDF</button></div><div id="qr-status" class="qr-status">Enter content to begin.</div></aside></div></main><script src="libs/qrcode-generator.js"></script><script src="libs/pdf-lib.min.js"></script><script src="qr.js"></script></body></html>
